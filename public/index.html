<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Escolar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<script>
  // Aplica o tema salvo antes do CSS pintar a página, pra evitar flash do tema errado.
  (function () {
    var tema = localStorage.getItem('biblioteca_tema');
    if (tema === 'light' || tema === 'dark') document.documentElement.setAttribute('data-theme', tema);
  })();
</script>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="tela-login" class="login-screen hidden">
  <form id="form-login" class="login-card">
    <div class="login-logo" data-logo-biblioteca>📚</div>
    <h1 data-nome-biblioteca>Biblioteca Escolar</h1>
    <p class="login-sub">Entre com sua conta para continuar</p>
    <div class="campo">
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email" required autocomplete="username">
    </div>
    <div class="campo">
      <label for="login-senha">Senha</label>
      <input type="password" id="login-senha" required autocomplete="current-password">
    </div>
    <label class="toggle" style="margin: -4px 0 12px;">
      <input type="checkbox" id="login-lembrar">
      <span class="toggle-trilho"></span>
      <span class="toggle-texto">Manter-me conectado</span>
    </label>
    <p id="login-erro" class="mensagem-erro hidden"></p>
    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-logo"><span data-logo-biblioteca>📚</span> <span data-nome-biblioteca>Biblioteca</span></div>
    <nav class="sidebar-nav">
      <a href="#/" data-rota="/" class="nav-link">🏠 <span>Dashboard</span></a>
      <a href="#/livros" data-rota="/livros" class="nav-link">📖 <span>Livros</span></a>
      <a href="#/alunos" data-rota="/alunos" class="nav-link">🎓 <span>Alunos</span></a>
      <a href="#/emprestimos" data-rota="/emprestimos" class="nav-link">🔄 <span>Empréstimos</span></a>
      <a href="#/estatisticas" data-rota="/estatisticas" class="nav-link">📊 <span>Estatísticas</span></a>
      <a href="#/gestao-usuarios" data-rota="/gestao-usuarios" class="nav-link" data-permissao="usuarios.gerenciar,papeis.gerenciar">👥 <span>Gestão de Usuários</span></a>
      <a href="#/auditoria" data-rota="/auditoria" class="nav-link" data-permissao="auditoria.ver">📜 <span>Auditoria</span></a>
      <a href="#/configuracoes" data-rota="/configuracoes" class="nav-link">⚙️ <span>Configurações</span></a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <div class="user-nome" id="user-nome">—</div>
        <button id="btn-logout" class="link-sair">Sair</button>
      </div>
    </div>
    <div class="sidebar-versao">
      <span id="sidebar-versao"></span>
      <button type="button" id="sidebar-btn-atualizar" class="link-atualizar hidden"></button>
    </div>
  </aside>

  <main class="conteudo">
    <div id="view" class="view"></div>
  </main>
</div>

<!-- MODAL GENÉRICO -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-titulo">Título</h2>
      <button id="modal-fechar" class="modal-fechar" type="button">&times;</button>
    </div>
    <div id="modal-corpo" class="modal-corpo"></div>
  </div>
</div>

<!-- TOASTS -->
<div id="toast-container" class="toast-container"></div>

<!-- TELA DE ATUALIZAÇÃO — fixa, sem como fechar (exceto em caso de erro) -->
<div id="atualizacao-overlay" class="atualizacao-overlay hidden">
  <div class="atualizacao-caixa">
    <div id="atualizacao-spinner" class="atualizacao-spinner"></div>
    <h2 id="atualizacao-titulo">Atualizando o sistema</h2>
    <p id="atualizacao-mensagem" class="sub">Preparando…</p>
    <div class="atualizacao-barra"><div id="atualizacao-barra-preenchida" class="atualizacao-barra-preenchida"></div></div>
    <button type="button" id="atualizacao-btn-fechar" class="btn btn-secondary btn-sm hidden">Fechar</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
